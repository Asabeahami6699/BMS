<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="aabanker — Banking Management System. Install on desktop or mobile." />
    <meta name="application-name" content="aabanker" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="aabanker" />
    <title>aabanker — Banking Management System</title>
    <script>
      (function () {
        function appendLink(rel, href, extra) {
          var link = document.createElement("link");
          link.rel = rel;
          link.href = href;
          if (extra) {
            for (var k in extra) {
              link.setAttribute(k, extra[k]);
            }
          }
          document.head.appendChild(link);
        }

        function attachDefaultIcons() {
          appendLink("icon", "/favicon-32.png", { type: "image/png", sizes: "32x32" });
          appendLink("icon", "/favicon-48.png", { type: "image/png", sizes: "48x48" });
          appendLink("icon", "/favicon.png", { type: "image/png" });
          appendLink("shortcut icon", "/favicon.png", { type: "image/png" });
          appendLink("apple-touch-icon", "/icons/icon-180.png", { sizes: "180x180" });
        }

        try {
          var theme = localStorage.getItem("bms.theme");
          if (theme !== "light" && theme !== "dark") theme = "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute("content", theme === "light" ? "#f4f6fa" : "#0b0e14");

          var rawApi = "%VITE_API_URL%";
          var host = (window.location.hostname || "").toLowerCase().replace(/\.$/, "");
          var isLocal = host === "localhost" || host.endsWith(".localhost") || host === "127.0.0.1";
          var useSameOriginProxy =
            window.location.protocol === "https:" &&
            (host === "aabanker.com" || host.endsWith(".aabanker.com") || host.endsWith(".vercel.app"));
          var apiBase = rawApi && rawApi.indexOf("%VITE_") === -1
            ? rawApi.replace(/\/+$/, "").replace(/\/api$/, "")
            : (isLocal ? "http://localhost:4000" : "");

          // Detect company subdomain (e.g. ese.aabanker.com / ese.localhost)
          var reserved = {
            www: 1, api: 1, admin: 1, app: 1, mail: 1, platform: 1,
            ns1: 1, ns2: 1, vercel: 1, ftp: 1, smtp: 1
          };
          var sub = null;
          var suffixes = [".aabanker.com", ".localhost"];
          for (var i = 0; i < suffixes.length; i++) {
            if (host.endsWith(suffixes[i])) {
              var label = host.slice(0, -suffixes[i].length);
              if (label && label.indexOf(".") === -1 && !reserved[label]) {
                sub = label;
              }
              break;
            }
          }

          var rawBrand = sub
            ? localStorage.getItem("bms.hostBrand.v1." + sub)
            : localStorage.getItem("bms.activeBrand.v1");
          var cached = rawBrand ? JSON.parse(rawBrand) : null;

          if (cached && cached.name) {
            document.title = cached.name;
            var appName = document.querySelector('meta[name="application-name"]');
            if (appName) appName.setAttribute("content", cached.name);
            var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appleTitle) appleTitle.setAttribute("content", String(cached.name).slice(0, 15));
          }

          var originParam = encodeURIComponent(window.location.origin);
          var idQuery = sub
            ? "subdomain=" + encodeURIComponent(sub)
            : cached && cached.subdomain
              ? "subdomain=" + encodeURIComponent(cached.subdomain)
              : cached && cached.tenantId
                ? "tenantId=" + encodeURIComponent(cached.tenantId)
                : "";

          if (idQuery && (useSameOriginProxy || apiBase)) {
            var pwaBase = useSameOriginProxy ? "/pwa" : apiBase + "/api/v1/auth";
            var sameOriginFlag = useSameOriginProxy ? "&sameOrigin=1" : "";
            appendLink(
              "manifest",
              pwaBase + "/manifest.webmanifest?" + idQuery + "&origin=" + originParam + sameOriginFlag
            );
            var faviconUrl = pwaBase + "/company-icon?" + idQuery + "&size=64&purpose=any";
            var appleIconUrl = pwaBase + "/company-icon?" + idQuery + "&size=180&purpose=apple";
            appendLink("icon", faviconUrl, { type: "image/png" });
            appendLink("shortcut icon", faviconUrl, { type: "image/png" });
            appendLink("apple-touch-icon", appleIconUrl, { sizes: "180x180" });
          } else {
            attachDefaultIcons();
            appendLink("manifest", "/manifest.webmanifest");
          }
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
          attachDefaultIcons();
          appendLink("manifest", "/manifest.webmanifest");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
