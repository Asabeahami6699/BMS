<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="aabanker — Banking Management System. Install on desktop or mobile." />
    <meta name="application-name" content="aabanker" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="aabanker" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>aabanker — Banking Management System</title>
    <script>
      (function () {
        function attachManifest(href) {
          var link = document.querySelector('link[rel="manifest"]');
          if (!link) {
            link = document.createElement("link");
            link.rel = "manifest";
            document.head.appendChild(link);
          }
          link.setAttribute("href", href);
        }

        try {
          var theme = localStorage.getItem("bms.theme");
          if (theme !== "light" && theme !== "dark") theme = "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute("content", theme === "light" ? "#f4f6fa" : "#0b0e14");

          var rawApi = "%VITE_API_URL%";
          var host = (window.location.hostname || "").toLowerCase().replace(/\.$/, "");
          var apiBase = rawApi && rawApi.indexOf("%VITE_") === -1
            ? rawApi.replace(/\/+$/, "").replace(/\/api$/, "")
            : (host === "localhost" || host.endsWith(".localhost") ? "http://localhost:4000" : "");

          // Detect company subdomain (e.g. opiokosusu.aabanker.com / opiokosusu.localhost)
          var reserved = {
            www: 1, api: 1, admin: 1, app: 1, mail: 1, platform: 1,
            ns1: 1, ns2: 1, vercel: 1, ftp: 1, smtp: 1
          };
          var sub = null;
          var suffixes = [".aabanker.com", ".localhost"];
          for (var i = 0; i < suffixes.length; i++) {
            if (host.endsWith(suffixes[i])) {
              var label = host.slice(0, -suffixes[i].length);
              if (label && label.indexOf(".") === -1 && !reserved[label]) {
                sub = label;
              }
              break;
            }
          }

          var rawBrand = sub
            ? localStorage.getItem("bms.hostBrand.v1." + sub)
            : localStorage.getItem("bms.activeBrand.v1");
          var cached = rawBrand ? JSON.parse(rawBrand) : null;

          if (cached && cached.name) {
            document.title = cached.name;
            var appName = document.querySelector('meta[name="application-name"]');
            if (appName) appName.setAttribute("content", cached.name);
            var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appleTitle) appleTitle.setAttribute("content", String(cached.name).slice(0, 15));
            if (cached.brandColor && themeMeta) {
              themeMeta.setAttribute("content", cached.brandColor);
            }
          }

          var originParam = encodeURIComponent(window.location.origin);
          var idQuery = sub
            ? "subdomain=" + encodeURIComponent(sub)
            : cached && cached.subdomain
              ? "subdomain=" + encodeURIComponent(cached.subdomain)
              : cached && cached.tenantId
                ? "tenantId=" + encodeURIComponent(cached.tenantId)
                : "";

          if (idQuery && apiBase) {
            // Attach real HTTPS company manifest immediately at 0ms so Chrome Desktop,
            // Edge Desktop, and Android WebAPK always see a valid installable company PWA.
            attachManifest(
              apiBase + "/api/v1/auth/manifest.webmanifest?" + idQuery + "&origin=" + originParam
            );
            var faviconUrl = apiBase + "/api/v1/auth/company-icon?" + idQuery + "&size=64&purpose=any";
            var appleIconUrl = apiBase + "/api/v1/auth/company-icon?" + idQuery + "&size=180&purpose=apple";
            var favIcons = document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"]');
            for (var j = 0; j < favIcons.length; j++) {
              favIcons[j].setAttribute("href", faviconUrl);
            }
            var appleIcons = document.querySelectorAll('link[rel="apple-touch-icon"]');
            for (var k = 0; k < appleIcons.length; k++) {
              appleIcons[k].setAttribute("href", appleIconUrl);
            }
          } else {
            attachManifest("/manifest.webmanifest");
          }
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
          attachManifest("/manifest.webmanifest");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
